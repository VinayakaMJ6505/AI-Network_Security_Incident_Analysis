# ============================================================
# Cloud Build CI/CD Pipeline — cloudbuild.yaml
# Triggers on push to main:
#   1. Build & push backend image to Artifact Registry
#   2. Build & push frontend image to Artifact Registry
#   3. Deploy backend Cloud Run service
#   4. Deploy frontend Cloud Run service
#
# Required substitution variables (set in Cloud Build trigger):
#   _REGION            — e.g. us-central1
#   _PROJECT_ID        — GCP project ID
#   _MONGODB_URI       — MongoDB Atlas or GCP VM connection string
#   _GROQ_API_KEY      — (optional)
#   _OPENAI_API_KEY    — (optional)
# ============================================================
substitutions:
  _REGION: "us-central1"
  _REPO: "ai-security"
  _BACKEND_SERVICE: "ai-security-backend"
  _FRONTEND_SERVICE: "ai-security-frontend"

steps:

  # ── 0. Run backend tests ──────────────────────────────────
  - name: "python:3.11-slim"
    id: "backend-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -r backend/requirements.txt -q
        pip install -r backend/requirements-test.txt -q
        python -m pytest backend/tests/ -q --tb=short --ignore=backend/tests/verify_live_e2e_workflow.py
    env:
      - "MONGODB_URI=mongodb://localhost:27017"
      - "MONGODB_DB_NAME=test_db"

  # ── 1. Build backend Docker image ────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    args:
      - "build"
      - "-f"
      - "Dockerfile.backend"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest"
      - "."
    waitFor: ["backend-tests"]

  # ── 2. Push backend image ─────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-backend"
    args: ["push", "--all-tags",
           "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend"]
    waitFor: ["build-backend"]

  # ── 3. Deploy backend to Cloud Run ────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-backend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_BACKEND_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--concurrency=80"
      # GCP_PROJECT_ID/GCP_REGION let genai_service.py call Vertex AI (Gemini)
      # via Application Default Credentials — no key needed. This requires a
      # ONE-TIME manual grant (not automated here, since it needs project
      # IAM-admin rights beyond what a deploy pipeline should hold):
      #   gcloud projects add-iam-policy-binding $PROJECT_ID \
      #     --member="serviceAccount:<cloud-run-runtime-sa>" \
      #     --role="roles/aiplatform.user"
      - "--set-env-vars=MONGODB_URI=${_MONGODB_URI},MONGODB_DB_NAME=incident_db,GROQ_API_KEY=${_GROQ_API_KEY},OPENAI_API_KEY=${_OPENAI_API_KEY},GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION}"
    waitFor: ["push-backend"]

  # ── 4. Read back the real backend URL ─────────────────────
  # Cloud Run only assigns the service URL once it's deployed, so the
  # frontend image (which needs to bake VITE_API_BASE_URL in at build
  # time) cannot be built in parallel with the backend — it has to wait
  # for this step. This replaces a previous hardcoded URL guess
  # (`${_BACKEND_SERVICE}-${_HASH}-${_REGION}.a.run.app`) that referenced
  # an undefined `_HASH` substitution and also guessed a Cloud Run URL
  # format that isn't guaranteed for a given project/region.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "get-backend-url"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        gcloud run services describe "${_BACKEND_SERVICE}" \
          --region="${_REGION}" --format="value(status.url)" \
          > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
    waitFor: ["deploy-backend"]

  # ── 5. Build frontend Docker image (using the real backend URL) ──
  - name: "gcr.io/cloud-builders/docker"
    id: "build-frontend"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build -f Dockerfile.frontend \
          --build-arg VITE_API_BASE_URL="$(cat /workspace/backend_url.txt)" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:latest" \
          .
    waitFor: ["get-backend-url"]

  # ── 6. Push frontend image ────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-frontend"
    args: ["push", "--all-tags",
           "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend"]
    waitFor: ["build-frontend"]

  # ── 7. Deploy frontend to Cloud Run ───────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy-frontend"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_FRONTEND_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=256Mi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
    waitFor: ["push-frontend"]

# Store built images in Artifact Registry
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/frontend:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1800s"
