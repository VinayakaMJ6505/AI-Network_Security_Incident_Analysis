# ============================================================
# docker-compose.yml — Full local stack mirroring GCP layout
# Services: backend (FastAPI) + frontend (nginx) + MongoDB
# ============================================================
services:

  # ── MongoDB ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: ai_security_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: incident_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_security_backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB_NAME: "incident_db"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── React Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Point the frontend to the backend service in this compose stack
        VITE_API_BASE_URL: "http://localhost:8000"
    container_name: ai_security_frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
    driver: local
